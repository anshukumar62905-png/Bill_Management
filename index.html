<!DOCTYPE html>
<html lang="en" ng-app="billingApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - Billing Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-panel: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes textGradientPulse {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .magic-text {
            background: linear-gradient(270deg, #ff007f, #7928ca, #00d4ff, #10b981, #ff007f);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGradientPulse 4s infinite linear;
        }

        @keyframes smoothColorShift {
            0% {
                background-color: #4f46e5;
                box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
            }

            25% {
                background-color: #0ea5e9;
                box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
            }

            50% {
                background-color: #10b981;
                box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            }

            75% {
                background-color: #8b5cf6;
                box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            }

            100% {
                background-color: #4f46e5;
                box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
            }
        }

        .magic-button {
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            animation: smoothColorShift 4s infinite linear;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .magic-button:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .sidebar {
            width: 260px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .brand {
            padding: 2rem;
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            padding: 0 1rem;
            gap: 0.5rem;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 1.2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            border-radius: var(--radius-md);
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: var(--bg-panel);
            color: white;
        }

        .nav-links a i {
            font-size: 1.2rem;
            width: 24px;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }

        .content-area {
            padding: 2.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--bg-surface);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.4s ease-out;
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .amount {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
        }

        .panel {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 2rem;
            margin-bottom: 2rem;
            animation: slideUp 0.5s ease-out;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg-panel);
            color: var(--text-muted);
            padding: 1.2rem 1rem;
            text-align: left;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-paid {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }

        .status-overdue {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-control {
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: white;
            padding: 1rem;
            border-radius: var(--radius-md);
            outline: none;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-outline:hover {
            background: var(--bg-panel);
        }

        .invoice-totals {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            width: 300px;
            font-size: 1.1rem;
        }

        .total-row.grand-total {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            margin-top: 10px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body ng-controller="BillingCtrl">

    <aside class="sidebar">
        <div class="brand magic-text">
            <i class="fa-solid fa-file-invoice-dollar"></i> PayFlow
        </div>

        <nav class="nav-links">
            <a href="#!/dashboard" ng-class="{active: currentPath == '/dashboard'}">
                <i class="fa-solid fa-chart-pie"></i> Overview
            </a>
            <a href="#!/create" ng-class="{active: currentPath == '/create'}">
                <i class="fa-solid fa-plus"></i> Create Invoice
            </a>
            <a href="#!/invoices" ng-class="{active: currentPath == '/invoices'}">
                <i class="fa-solid fa-receipt"></i> All Invoices
            </a>
            <a href="#!/clients" ng-class="{active: currentPath == '/clients'}">
                <i class="fa-solid fa-users"></i> Clients
            </a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <h2 style="font-weight: 700;">{{pageTitle}}</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="text-align: right;">
                    <div style="font-weight: 700; font-size: 0.95rem;">Anshu Admin</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Finance Dept</div>
                </div>
                <div
                    style="width: 45px; height: 45px; background: var(--bg-panel); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700;">
                    AN</div>
            </div>
        </header>

        <main class="content-area">
            <div ng-view></div>
        </main>
    </div>

    <!-- Dashboard View -->
    <script type="text/ng-template" id="dashboard.html">
        <div class="grid-3">
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <!-- Changed to ₹ -->
                <div class="amount">{{getTotalRevenue() | currency:'₹'}}</div>
                <div style="color: #34d399; font-size: 0.9rem; font-weight: 600;">
                    <i class="fa-solid fa-arrow-trend-up"></i> +14.5% from last month
                </div>
            </div>
            <div class="stat-card">
                <h3>Outstanding Balance</h3>
                <!-- Changed to ₹ -->
                <div class="amount">{{getOutstanding() | currency:'₹'}}</div>
                <div style="color: #fbbf24; font-size: 0.9rem; font-weight: 600;">
                    Waiting on {{getPendingCount()}} invoices
                </div>
            </div>
            <div class="stat-card">
                <h3>Overdue Amounts</h3>
                <!-- Changed to ₹ -->
                <div class="amount" style="color: #f87171;">{{getOverdue() | currency:'₹'}}</div>
                <div style="color: #f87171; font-size: 0.9rem; font-weight: 600;">
                    <i class="fa-solid fa-circle-exclamation"></i> Immediate action required
                </div>
            </div>
        </div>

        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h3 style="font-size: 1.4rem;">Recent Transactions</h3>
                <a href="#!/create" style="text-decoration: none;">
                    <button class="magic-button" style="padding: 0.6rem 1.2rem; font-size: 0.9rem;">
                        <i class="fa-solid fa-plus"></i> New Invoice
                    </button>
                </a>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Invoice ID</th>
                            <th>Client</th>
                            <th>Date Issued</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="inv in invoices | limitTo: 5 | orderBy:'-date'">
                            <td style="font-weight: 700;">#INV-{{inv.id}}</td>
                            <td>
                                <div style="font-weight: 600;">{{inv.client}}</div>
                            </td>
                            <td>{{inv.date | date:'mediumDate'}}</td>
                            <!-- Changed to ₹ -->
                            <td style="font-weight: 700;">{{inv.amount | currency:'₹'}}</td>
                            <td>
                                <span class="badge" ng-class="'status-' + inv.status.toLowerCase()">
                                    {{inv.status}}
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </script>

    <!-- Create Invoice View -->
    <script type="text/ng-template" id="create.html">
        <div class="panel">
            <h3 style="margin-bottom: 2rem; font-size: 1.4rem;">Generate New Invoice</h3>
            
            <div class="form-grid" style="margin-bottom: 2rem;">
                <div class="input-group">
                    <label>Client Name</label>
                    <input type="text" class="form-control" ng-model="newInv.client" placeholder="e.g. Acme Corp">
                </div>
                <div class="input-group">
                    <label>Client Email</label>
                    <input type="email" class="form-control" ng-model="newInv.email" placeholder="billing@acme.com">
                </div>
                <div class="input-group">
                    <label>Due Date</label>
                    <input type="date" class="form-control" ng-model="newInv.dueDate">
                </div>
            </div>

            <h4 style="margin-bottom: 1rem; color: var(--text-muted); text-transform: uppercase; font-size: 0.9rem;">Itemized Billing</h4>
            
            <div class="table-wrapper" style="margin-bottom: 1.5rem;">
                <table>
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th style="width: 150px;">Qty</th>
                            <th style="width: 200px;">Price (₹)</th>
                            <th style="width: 200px;">Total</th>
                            <th style="width: 80px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in newInv.items track by $index">
                            <td><input type="text" class="form-control" ng-model="item.desc" placeholder="Service / Product"></td>
                            <td><input type="number" class="form-control" ng-model="item.qty" min="1" ng-change="calcTotals()"></td>
                            <td><input type="number" class="form-control" ng-model="item.price" min="0" ng-change="calcTotals()"></td>
                            <!-- Changed to ₹ -->
                            <td style="font-weight: 700;">{{(item.qty * item.price) | currency:'₹'}}</td>
                            <td>
                                <button class="btn-outline" style="color: var(--danger); border-color: var(--danger);" ng-click="removeItem($index)">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button class="btn-outline" ng-click="addItem()">
                <i class="fa-solid fa-plus"></i> Add Line Item
            </button>

            <div class="invoice-totals">
                <div class="total-row">
                    <span style="color: var(--text-muted);">Subtotal:</span>
                    <!-- Changed to ₹ -->
                    <span>{{newInv.subtotal | currency:'₹'}}</span>
                </div>
                <div class="total-row">
                    <span style="color: var(--text-muted);">Tax (10%):</span>
                    <!-- Changed to ₹ -->
                    <span>{{newInv.tax | currency:'₹'}}</span>
                </div>
                <div class="total-row grand-total">
                    <span>Total Due:</span>
                    <!-- Changed to ₹ -->
                    <span>{{newInv.total | currency:'₹'}}</span>
                </div>
                
                <div style="margin-top: 1.5rem;">
                    <button class="magic-button" ng-click="saveInvoice()">
                        <i class="fa-solid fa-paper-plane"></i> Generate & Send Invoice
                    </button>
                </div>
            </div>
        </div>
    </script>

    <!-- Invoices List View -->
    <script type="text/ng-template" id="invoices.html">
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h3 style="font-size: 1.4rem;">Invoice Registry</h3>
                <input type="text" class="form-control" style="width: 300px;" placeholder="Search invoices..." ng-model="searchInv">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Invoice ID</th>
                            <th>Client Info</th>
                            <th>Amount</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="inv in invoices | filter:searchInv | orderBy:'-id'">
                            <td style="font-weight: 700;">#INV-{{inv.id}}</td>
                            <td>
                                <div style="font-weight: 600;">{{inv.client}}</div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">{{inv.email}}</div>
                            </td>
                            <!-- Changed to ₹ -->
                            <td style="font-weight: 700;">{{inv.amount | currency:'₹'}}</td>
                            <td ng-style="{color: (inv.status == 'Overdue') ? 'var(--danger)' : 'inherit'}">
                                {{inv.dueDate | date:'mediumDate'}}
                            </td>
                            <td>
                                <span class="badge" ng-class="'status-' + inv.status.toLowerCase()">
                                    {{inv.status}}
                                </span>
                            </td>
                            <td style="text-align: right;">
                                <button class="btn-outline" ng-if="inv.status !== 'Paid'" ng-click="markPaid(inv)">
                                    <i class="fa-solid fa-check"></i> Mark Paid
                                </button>
                                <button class="btn-outline" ng-if="inv.status === 'Paid'" disabled style="opacity: 0.5;">
                                    Settled
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </script>

    <!-- Clients View -->
    <script type="text/ng-template" id="clients.html">
        <div class="panel">
            <h3 style="margin-bottom: 2rem; font-size: 1.4rem;">Client Directory</h3>
            <div style="text-align: center; color: var(--text-muted); padding: 3rem;">
                <i class="fa-solid fa-users-gear" style="font-size: 3rem; margin-bottom: 1rem; color: var(--bg-panel);"></i>
                <p>Client CRM Module is currently being deployed.</p>
            </div>
        </div>
    </script>

    <script>
        var app = angular.module("billingApp", ["ngRoute"]);

        app.config(function ($routeProvider) {
            $routeProvider
                .when("/dashboard", { templateUrl: "dashboard.html", title: "Financial Dashboard" })
                .when("/create", { templateUrl: "create.html", title: "Invoice Generator" })
                .when("/invoices", { templateUrl: "invoices.html", title: "All Invoices" })
                .when("/clients", { templateUrl: "clients.html", title: "Client Directory" })
                .otherwise({ redirectTo: "/dashboard" });
        });

        app.controller("BillingCtrl", function ($scope, $rootScope, $location) {

            $rootScope.$on('$routeChangeSuccess', function (event, current) {
                $scope.pageTitle = current.$$route ? current.$$route.title : 'PayFlow';
                $scope.currentPath = $location.path();
            });

            var today = new Date();
            var past = new Date(); past.setDate(today.getDate() - 15);
            var future = new Date(); future.setDate(today.getDate() + 15);

            // Updated mock data to reflect realistic Rupee amounts
            $scope.invoices = [
                { id: 1004, client: "TechFlow Solutions", email: "accounts@techflow.io", date: past, dueDate: today, amount: 45000.00, status: "Paid" },
                { id: 1005, client: "Apex Industries", email: "billing@apex.com", date: today, dueDate: future, amount: 21500.50, status: "Pending" },
                { id: 1006, client: "Global Media Group", email: "finance@globalmedia.net", date: past, dueDate: past, amount: 18900.00, status: "Overdue" }
            ];

            $scope.getTotalRevenue = function () {
                return $scope.invoices.filter(i => i.status === 'Paid').reduce((a, b) => a + b.amount, 0);
            };

            $scope.getOutstanding = function () {
                return $scope.invoices.filter(i => i.status === 'Pending').reduce((a, b) => a + b.amount, 0);
            };

            $scope.getOverdue = function () {
                return $scope.invoices.filter(i => i.status === 'Overdue').reduce((a, b) => a + b.amount, 0);
            };

            $scope.getPendingCount = function () {
                return $scope.invoices.filter(i => i.status === 'Pending').length;
            };

            $scope.markPaid = function (inv) {
                inv.status = 'Paid';
            };

            $scope.newInv = {
                client: '', email: '', dueDate: '', items: [{ desc: '', qty: 1, price: 0 }], subtotal: 0, tax: 0, total: 0
            };

            $scope.addItem = function () {
                $scope.newInv.items.push({ desc: '', qty: 1, price: 0 });
            };

            $scope.removeItem = function (index) {
                if ($scope.newInv.items.length > 1) {
                    $scope.newInv.items.splice(index, 1);
                    $scope.calcTotals();
                }
            };

            $scope.calcTotals = function () {
                $scope.newInv.subtotal = $scope.newInv.items.reduce((a, b) => a + (b.qty * b.price), 0);
                $scope.newInv.tax = $scope.newInv.subtotal * 0.10; // 10% tax
                $scope.newInv.total = $scope.newInv.subtotal + $scope.newInv.tax;
            };

            $scope.saveInvoice = function () {
                if (!$scope.newInv.client || $scope.newInv.total === 0) {
                    alert("Please enter a client and at least one priced item.");
                    return;
                }

                var newId = Math.max(...$scope.invoices.map(i => i.id)) + 1;

                $scope.invoices.push({
                    id: newId,
                    client: $scope.newInv.client,
                    email: $scope.newInv.email,
                    date: new Date(),
                    dueDate: $scope.newInv.dueDate || new Date(),
                    amount: $scope.newInv.total,
                    status: "Pending"
                });

                $scope.newInv = { client: '', email: '', dueDate: '', items: [{ desc: '', qty: 1, price: 0 }], subtotal: 0, tax: 0, total: 0 };
                $location.path('/invoices');
            };
        });
    </script>
</body>

</html>
